<svg width="720" height="240" viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WiFi Lab — Hacking Ético" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g_blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E8BD6"/>
      <stop offset="1" stop-color="#1F3864"/>
    </linearGradient>
    <linearGradient id="g_wave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5BC0F8"/>
      <stop offset="1" stop-color="#2E8BD6"/>
    </linearGradient>
  </defs>

  <!-- ICONO: escudo con ondas Wi-Fi -->
  <g transform="translate(40,34)">
    <!-- Escudo -->
    <path d="M86 4 L160 26 V92 C160 134 129 162 86 172 C43 162 12 134 12 92 V26 Z"
          fill="url(#g_blue)"/>
    <path d="M86 4 L160 26 V92 C160 134 129 162 86 172 C43 162 12 134 12 92 V26 Z"
          fill="none" stroke="#5BC0F8" stroke-width="2" opacity="0.35"/>

    <!-- Ondas Wi-Fi -->
    <g transform="translate(86,74)" fill="none" stroke="#EAF6FF" stroke-linecap="round">
      <path d="M-44 -6 A62 62 0 0 1 44 -6" stroke-width="9" opacity="0.45"/>
      <path d="M-30 6 A44 44 0 0 1 30 6" stroke-width="9" opacity="0.70"/>
      <path d="M-16 18 A26 26 0 0 1 16 18" stroke-width="9"/>
      <circle cx="0" cy="34" r="8" fill="#EAF6FF" stroke="none"/>
    </g>

    <!-- Guiño a terminal: prompt ">_" en la punta del escudo -->
    <g transform="translate(86,140)" fill="#5BC0F8">
      <path d="M-13 -6 L-5 0 L-13 6 Z"/>
      <rect x="-1" y="4" width="14" height="3.4" rx="1.7"/>
    </g>
  </g>

  <!-- TEXTO -->
  <g transform="translate(232,0)">
    <text x="0" y="110" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="56" font-weight="700" fill="#1F3864" letter-spacing="-1">
      WiFi<tspan fill="#2E8BD6">Lab</tspan>
    </text>
    <text x="2" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="33" font-weight="400" fill="#2E8BD6" letter-spacing="7">
      GENERATOR
    </text>
    <text x="2" y="178" font-family="'Consolas', 'Courier New', monospace"
          font-size="20" font-weight="500" fill="#5B6B86" letter-spacing="1.5">
      HACKING ÉTICO
    </text>
    <rect x="2" y="192" width="300" height="4" rx="2" fill="url(#g_wave)"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
